name: D40 FPP APK bauen

on:
  push:
    branches: [d40fpp-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Signaturschluessel (gleichbleibend fuer Updates)
        run: mkdir -p ~/.android && cp android-signing/debug.keystore ~/.android/debug.keystore
      - name: APK bauen (Debug)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log
      - name: Ergebnis auf Branch fpp-build-output veroeffentlichen
        if: always()
        run: |
          mkdir pub
          cp build.log pub/ || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then cp app/build/outputs/apk/debug/app-debug.apk pub/D40FPP-0.1.apk; echo OK > pub/STATUS; else echo FEHLER > pub/STATUS; fi
          cd pub
          git init -q -b fpp-build-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" fpp-build-output
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: D40FPP-0.1
          path: app/build/outputs/apk/debug/app-debug.apk
