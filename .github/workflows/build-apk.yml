name: Build APK
on:
  push:
    branches-ignore: [build-output]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: pip install pillow
      - run: npm test
      - name: Build single-file HTML
        run: mkdir -p out && python3 scripts/bundle_html.py out/D40_Performance_Fuel.html
      - run: npx cap add android
      - run: python3 scripts/make_icons.py
      - run: npx cap sync android
      - name: Fixed signing key and version (allows updates over the installed app)
        run: |
          mkdir -p ~/.android && cp android-signing/debug.keystore ~/.android/debug.keystore
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: D40-Performance-Fuel-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: D40-Performance-Fuel-html
          path: out/D40_Performance_Fuel.html
      - name: Publish build files to branch build-output
        run: |
          mkdir pub
          cp android/app/build/outputs/apk/debug/app-debug.apk pub/D40-Performance-Fuel-debug.apk
          cp out/D40_Performance_Fuel.html pub/
          cd pub
          git init -q -b build-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" build-output
